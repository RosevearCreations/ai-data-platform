name: Verify

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      legacy_audit:
        description: Run the exhaustive historical verifier audit after the compact promotion gate
        required: false
        default: false
        type: boolean
  schedule:
    - cron: "17 7 * * 0"

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ai_data_platform_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ai_data_platform_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/ai_data_platform_test
      BETTER_AUTH_SECRET: build-002-ci-only-secret-please-never-use-in-production-000000000000
      BETTER_AUTH_URL: http://localhost:3000
      BETTER_AUTH_TRUSTED_ORIGINS: http://localhost:3000
      AUTH_ALLOW_SIGN_UP: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.8.1

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply database migrations
        run: pnpm --filter @rosevear/ai-data-web db:migrate

      - name: Determine whether legacy audit is required
        id: impact
        run: node apps/web/scripts/ci-detect-legacy-impact.mjs
        env:
          MANUAL_LEGACY: ${{ inputs.legacy_audit }}

      - name: Run authoritative compact promotion gate
        if: github.event_name != 'schedule'
        run: pnpm ci:promotion

      - name: Run exhaustive historical audit when required
        if: steps.impact.outputs.legacy_required == 'true'
        run: pnpm ci:legacy

      - name: Record consolidation result
        if: always()
        run: |
          {
            echo "## Build 292A CI consolidation"
            echo
            echo "- Authoritative GitHub promotion trigger: pull request into main"
            echo "- Push-triggered duplicate verification: removed"
            echo "- Historical audit required: ${{ steps.impact.outputs.legacy_required }}"
            echo "- Historical audit reason: ${{ steps.impact.outputs.legacy_reason }}"
            echo "- Scheduled legacy audit: Sundays at 07:17 UTC"
          } >> "$GITHUB_STEP_SUMMARY"
