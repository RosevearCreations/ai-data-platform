name: Verify

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      legacy_audit:
        description: Run the exhaustive historical verifier audit after the compact promotion gate
        required: false
        default: false
        type: boolean
  schedule:
    - cron: "17 7 * * 0"

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ai_data_platform_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ai_data_platform_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/ai_data_platform_test?sslmode=verify-full&sslrootcert=/tmp/ql467-ci-postgres.crt
      BETTER_AUTH_SECRET: build-002-ci-only-secret-please-never-use-in-production-000000000000
      BETTER_AUTH_URL: http://localhost:3000
      BETTER_AUTH_TRUSTED_ORIGINS: http://localhost:3000
      AUTH_ALLOW_SIGN_UP: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.8.1

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Enable verified TLS for ephemeral CI PostgreSQL only
        # CI-local service is a disposable container. Production retains verify-full.
        run: |
          set -euo pipefail
          openssl req -x509 -nodes -newkey rsa:2048 -days 1 \
            -subj '/CN=localhost' \
            -addext 'subjectAltName=IP:127.0.0.1,DNS:localhost' \
            -keyout /tmp/ql467-ci-postgres.key \
            -out /tmp/ql467-ci-postgres.crt >/dev/null 2>&1
          pg_container="$(docker ps --filter 'ancestor=postgres:18-alpine' -q | head -n 1)"
          test -n "$pg_container"
          docker cp /tmp/ql467-ci-postgres.key "$pg_container:/tmp/ql467-ci-postgres.key"
          docker cp /tmp/ql467-ci-postgres.crt "$pg_container:/tmp/ql467-ci-postgres.crt"
          docker exec -u root "$pg_container" sh -c "chown postgres:postgres /tmp/ql467-ci-postgres.key /tmp/ql467-ci-postgres.crt && chmod 0600 /tmp/ql467-ci-postgres.key && chmod 0644 /tmp/ql467-ci-postgres.crt"
          docker exec -e PGPASSWORD=postgres "$pg_container" psql -h 127.0.0.1 -U postgres -d ai_data_platform_test -v ON_ERROR_STOP=1 -c "ALTER SYSTEM SET ssl_cert_file TO '/tmp/ql467-ci-postgres.crt'"
          docker exec -e PGPASSWORD=postgres "$pg_container" psql -h 127.0.0.1 -U postgres -d ai_data_platform_test -v ON_ERROR_STOP=1 -c "ALTER SYSTEM SET ssl_key_file TO '/tmp/ql467-ci-postgres.key'"
          docker exec -e PGPASSWORD=postgres "$pg_container" psql -h 127.0.0.1 -U postgres -d ai_data_platform_test -v ON_ERROR_STOP=1 -c "ALTER SYSTEM SET ssl TO 'on'"
          docker exec -e PGPASSWORD=postgres "$pg_container" psql -h 127.0.0.1 -U postgres -d ai_data_platform_test -v ON_ERROR_STOP=1 -c "SELECT pg_reload_conf()"
          docker exec -e PGPASSWORD=postgres "$pg_container" psql -h 127.0.0.1 -U postgres -d ai_data_platform_test -v ON_ERROR_STOP=1 -c "SHOW ssl" | grep -q on
          openssl s_client -connect 127.0.0.1:5432 -starttls postgres \
            -CAfile /tmp/ql467-ci-postgres.crt -verify_return_error </dev/null 2>&1 | grep -q 'Verify return code: 0 (ok)'

      - name: Apply database migrations
        run: pnpm --filter @rosevear/ai-data-web db:migrate

      - name: Determine whether legacy audit is required
        id: impact
        run: node apps/web/scripts/ci-detect-legacy-impact.mjs
        env:
          MANUAL_LEGACY: ${{ inputs.legacy_audit }}

      - name: Run authoritative compact promotion gate
        if: github.event_name != 'schedule'
        run: pnpm ci:promotion

      # Both suites seed fixed synthetic identities. Run the exhaustive suite in
      # its own fresh CI-local database so a passing compact suite cannot
      # collide with it. Neither suite nor its required checks are skipped.
      - name: Prepare isolated historical audit database
        if: steps.impact.outputs.legacy_required == 'true'
        run: pnpm --filter @rosevear/ai-data-web exec node scripts/ci-create-legacy-audit-db.mjs

      - name: Apply migrations to isolated historical audit database
        if: steps.impact.outputs.legacy_required == 'true'
        run: pnpm --filter @rosevear/ai-data-web db:migrate
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/ai_data_platform_legacy_test?sslmode=verify-full&sslrootcert=/tmp/ql467-ci-postgres.crt

      - name: Run exhaustive historical audit when required
        if: steps.impact.outputs.legacy_required == 'true'
        run: pnpm ci:legacy
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/ai_data_platform_legacy_test?sslmode=verify-full&sslrootcert=/tmp/ql467-ci-postgres.crt

      - name: Record consolidation result
        if: always()
        run: |
          {
            echo "## Build 292A CI consolidation"
            echo
            echo "- Authoritative GitHub promotion trigger: pull request into main"
            echo "- Push-triggered duplicate verification: removed"
            echo "- Historical audit required: ${{ steps.impact.outputs.legacy_required }}"
            echo "- Historical audit reason: ${{ steps.impact.outputs.legacy_reason }}"
            echo "- Scheduled legacy audit: Sundays at 07:17 UTC"
          } >> "$GITHUB_STEP_SUMMARY"
